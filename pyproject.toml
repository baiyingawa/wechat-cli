[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-cli"
version = "0.1.0"
description = "Machine-first Linux WeChat desktop automation"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "python-xlib>=0.33", "numpy>=1.24", "rapidocr-onnxruntime>=1.4.4,<2"]

[project.scripts]
wechat-cli = "wechat_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
